<header class="site-header">
  <div class="glass bar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menü öffnen">

    <nav class="nav" aria-label="Hauptmenü">
      <ul>
        {% for item in site.data.navigation %}
        <li{% if item.children %} class="has-sub"{% endif %}>
          <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% if item.children %}
          <ul class="sub glass">
            {% for child in item.children %}
            <li><a href="{{ child.url | relative_url }}"{% if child.url == page.url %} aria-current="page"{% endif %}>{{ child.title }}</a></li>
            {% endfor %}
          </ul>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </nav>

    {% if site.logo %}
    <a class="logo" href="{{ site.logo_link | default: '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="Logo {{ site.title }}">
    </a>
    {% endif %}

    <label for="nav-toggle" class="burger" aria-hidden="true"><span></span></label>
  </div>
</header>
